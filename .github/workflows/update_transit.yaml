name: Mettre à jour les horaires Naolib

on:
  schedule:
    - cron: '*/5 * * * *'  # Toutes les 5 minutes (GitHub retarde souvent les crons plus fréquents)
  workflow_dispatch:       # Lancement manuel possible

permissions:
  contents: write          # INDISPENSABLE pour autoriser le bot à modifier le fichier JSON

# Un seul run à la fois : évite les push qui se chevauchent
concurrency:
  group: update-horaires
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 Exécuter le script Python
        run: python fetch_tan.py

      - name: 💾 Sauvegarder et publier 'horaires.json'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horaires.json
          git commit -m "Mise à jour automatique des horaires [skip ci]" || exit 0
          # Si le dépôt a avancé entre-temps, on resynchronise puis on repousse
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push refusé (tentative $i/3), nouvel essai..."
            sleep 3
          done
          exit 1
